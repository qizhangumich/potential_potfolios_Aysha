<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#2A0A15">
<title>Selected Investment Opportunities</title>
<meta name="description" content="Introductory investment discussion: selected opportunities in AI &amp; digital infrastructure and healthcare &amp; life sciences.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="#top" id="brand">SIO <span id="draft">/ Discussion draft</span></a>
    <div class="top-r">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" lang="en">EN</button>
        <button type="button" data-lang="zh" lang="zh-Hans">中文</button>
        <button type="button" data-lang="ar" lang="ar">العربية</button>
      </div>
      <button type="button" class="txt-btn" id="tocBtn" aria-expanded="false" aria-controls="toc">Contents</button>
    </div>
  </header>
  <main class="stage" id="stage" tabindex="-1" aria-live="polite"></main>
  <footer class="foot">
    <span class="sec-name" id="secName"></span>
    <nav class="segs" id="segs" aria-label="Pages"></nav>
    <button type="button" class="count" id="count" aria-controls="toc"></button>
    <div class="arrows">
      <button type="button" class="arw" id="prevBtn" aria-label="Previous"><span>&larr;</span></button>
      <button type="button" class="arw" id="nextBtn" aria-label="Next"><span>&rarr;</span></button>
    </div>
  </footer>
</div>
<div class="toc" id="toc" hidden>
  <div class="toc-in">
    <div class="toc-head"><h2 id="tocTitle">Contents</h2><button type="button" class="txt-btn" id="tocClose">Close</button></div>
    <ol class="toc-list" id="tocList"></ol>
  </div>
</div>
<script src="content.js?v=2"></script>
<script src="app.js?v=2"></script>
</body>
</html>
